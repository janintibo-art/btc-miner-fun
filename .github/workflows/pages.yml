name: Publier le site du Tibo

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Droits necessaires a la publication sur GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois : la derniere gagne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verifier que la chaine exportee est du JSON valide
        run: python3 -c "import json,sys; json.load(open('site/chain.json')); print('chain.json valide')"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v4
