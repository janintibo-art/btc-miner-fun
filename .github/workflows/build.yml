name: Tests, Android et Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  tests:
    name: Tests du moteur de minage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependances
        run: flutter pub get

      - name: Verifier les calculs sur un vrai bloc Bitcoin
        run: flutter test

  android:
    name: APK Android
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mettre les sources de cote
        run: |
          mkdir -p /tmp/src
          cp -r lib /tmp/src/lib
          cp -r test /tmp/src/test
          cp -r assets /tmp/src/assets
          cp pubspec.yaml /tmp/src/pubspec.yaml

      - name: Generer les dossiers de plateforme
        run: flutter create --project-name btc_miner_fun --org com.funminer --platforms=android,windows .

      - name: Restaurer les sources
        run: |
          rm -rf lib test
          cp -r /tmp/src/lib lib
          cp -r /tmp/src/test test
          cp -r /tmp/src/assets assets
          cp /tmp/src/pubspec.yaml pubspec.yaml

      - name: Dependances
        run: flutter pub get

      - name: Generer l'icone
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Patcher le manifeste Android
        run: python3 tool/patch_android.py

      - name: Construire l'APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: BTCMinerFun-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Executable Windows
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mettre les sources de cote
        run: |
          mkdir -p /tmp/src
          cp -r lib /tmp/src/lib
          cp -r test /tmp/src/test
          cp -r assets /tmp/src/assets
          cp pubspec.yaml /tmp/src/pubspec.yaml

      - name: Generer les dossiers de plateforme
        run: flutter create --project-name btc_miner_fun --org com.funminer --platforms=android,windows .

      - name: Restaurer les sources
        run: |
          rm -rf lib test
          cp -r /tmp/src/lib lib
          cp -r /tmp/src/test test
          cp -r /tmp/src/assets assets
          cp /tmp/src/pubspec.yaml pubspec.yaml

      - name: Activer la cible Windows
        run: flutter config --enable-windows-desktop

      - name: Dependances
        run: flutter pub get

      - name: Generer l'icone
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Renommer l'executable et la fenetre
        run: python tool/patch_windows.py

      - name: Construire l'executable
        run: flutter build windows --release

      - name: Rassembler les fichiers
        run: |
          RELEASE_DIR=$(find build/windows -type d -path "*runner/Release" | head -n 1)
          echo "Dossier trouve : $RELEASE_DIR"
          mkdir -p dist
          cp -r "$RELEASE_DIR"/* dist/

      - uses: actions/upload-artifact@v4
        with:
          name: BTCMinerFun-windows
          path: dist/**
          if-no-files-found: error
