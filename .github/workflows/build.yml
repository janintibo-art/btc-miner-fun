name: Tests, Android et Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  tests:
    name: Tests moteur et portefeuille
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Controle instantane, sans SDK : classes privees utilisees mais jamais
      # definies, imports morts. Il attrape en une seconde les defauts qui
      # coutaient auparavant un cycle complet de compilation.
      - name: Coherence des sources
        run: python3 tool/verifier_sources.py

      - name: Dependances
        run: flutter pub get

      # Depuis l'ajout du portefeuille, une erreur d'analyse bloque le build :
      # le code qui manipule la phrase de recuperation ne doit pas etre livre
      # avec une erreur statique ignoree.
      - name: Analyse statique Dart / Flutter
        run: flutter analyze --no-fatal-infos

      - name: Verifier les calculs sur un vrai bloc Bitcoin
        run: flutter test

  android:
    name: APK Android
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mettre les sources de cote
        run: |
          mkdir -p /tmp/src
          cp -r lib /tmp/src/lib
          cp -r test /tmp/src/test
          cp -r assets /tmp/src/assets
          cp pubspec.yaml /tmp/src/pubspec.yaml

      - name: Generer les dossiers de plateforme
        run: flutter create --project-name btc_miner_fun --org com.funminer --platforms=android,windows .

      - name: Restaurer les sources
        run: |
          rm -rf lib test
          cp -r /tmp/src/lib lib
          cp -r /tmp/src/test test
          cp -r /tmp/src/assets assets
          cp /tmp/src/pubspec.yaml pubspec.yaml

      - name: Dependances
        run: flutter pub get

      - name: Generer l'icone
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Patcher le manifeste Android
        run: python3 tool/patch_android.py

      # La cle de signature vient des secrets du depot, jamais du code.
      # Sans elle, la compilation continue avec la signature de debogage :
      # le projet reste utilisable par quiconque clone le depot.
      - name: Installer la cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Aucune cle configuree : signature de debogage."
            echo "Les mises a jour demanderont une desinstallation prealable."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/cle.jks
          taille=$(stat -c%s android/app/cle.jks)
          if [ "$taille" -lt 500 ]; then
            echo "La cle decodee fait $taille octets : secret invalide."
            exit 1
          fi
          cat > android/key.properties <<PROPS
          storeFile=cle.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          PROPS
          sed -i 's/^          //' android/key.properties
          echo "Cle installee ($taille octets)."

      - name: Construire les APK par architecture
        run: flutter build apk --release --split-per-abi

      - name: Construire l'APK universel (filet de securite)
        run: flutter build apk --release

      # Trace utile dans le journal : on saura toujours comment un APK a ete
      # signe, sans avoir a l'inspecter.
      - name: Nature de la signature
        run: |
          if [ -f android/key.properties ]; then
            echo "APK signes avec la cle de publication : les mises a jour"
            echo "s'installeront par-dessus les versions precedentes."
          else
            echo "APK signes en debogage : desinstallation necessaire avant"
            echo "chaque mise a jour."
          fi

      - name: Rassembler les APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: BTCMinerFun-android-apk
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Executable Windows
    needs: tests
    # flutter_secure_storage requiert les bibliotheques C++ ATL.
    # L'image Windows 2022 de GitHub Actions les fournit explicitement.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mettre les sources de cote
        run: |
          mkdir -p /tmp/src
          cp -r lib /tmp/src/lib
          cp -r test /tmp/src/test
          cp -r assets /tmp/src/assets
          cp pubspec.yaml /tmp/src/pubspec.yaml

      - name: Generer les dossiers de plateforme
        run: flutter create --project-name btc_miner_fun --org com.funminer --platforms=android,windows .

      - name: Restaurer les sources
        run: |
          rm -rf lib test
          cp -r /tmp/src/lib lib
          cp -r /tmp/src/test test
          cp -r /tmp/src/assets assets
          cp /tmp/src/pubspec.yaml pubspec.yaml

      - name: Activer la cible Windows
        run: flutter config --enable-windows-desktop

      - name: Dependances
        run: flutter pub get

      - name: Generer l'icone
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Renommer l'executable et la fenetre
        run: python tool/patch_windows.py

      - name: Construire l'executable
        run: flutter build windows --release

      - name: Rassembler les fichiers
        run: |
          RELEASE_DIR=$(find build/windows -type d -path "*runner/Release" | head -n 1)
          echo "Dossier trouve : $RELEASE_DIR"
          mkdir -p dist
          cp -r "$RELEASE_DIR"/* dist/
          cat > dist/LISEZMOI.txt <<'TXT'
          BTC Miner Fun - version Windows
          ================================

          Lancement : double-clique sur BTCMinerFun.exe

          Garde tous les fichiers du dossier ensemble : l'executable a besoin
          des DLL et du dossier data qui l'accompagnent. Tu peux deplacer le
          dossier entier ou l'on veut, mais pas l'executable tout seul.

          Raccourcis clavier
          ------------------
            F5           demarrer ou arreter le minage
            F11          mode veille plein ecran
            Ctrl + 1..6  changer d'onglet

          Reglages conseilles sur ordinateur
          ----------------------------------
          L'application propose par defaut tous les coeurs sauf un, et une
          intensite de 100 % : un ordinateur de bureau est ventile, il n'a pas
          les contraintes thermiques d'un telephone. Attends-toi a une
          puissance dix a cent fois superieure a celle d'un mobile.

          Windows affichera un avertissement SmartScreen au premier lancement :
          l'executable n'est pas signe par un certificat commercial. Clique sur
          "Informations complementaires" puis "Executer quand meme".
          TXT
          sed -i 's/^          //' dist/LISEZMOI.txt
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: BTCMinerFun-windows
          path: dist/**
          if-no-files-found: error
